<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-surface font-body-md text-on-surface"><main class="min-h-screen flex items-center justify-center p-lg"><div class="flex flex-col w-full h-full items-center justify-center bg-surface relative overflow-hidden p-gutter">
<!-- Decorative background elements -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl"></div>
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl p-xl relative z-10">
<!-- Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-full mb-lg shadow-md">
<span class="material-symbols-outlined text-on-primary text-[32px]">chat_bubble</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Connect with your people instantly</p>
</div>
<!-- Form -->
<form class="space-y-lg flex flex-col w-full" id="loginForm">
<!-- Name Input -->
<div class="space-y-sm flex flex-col w-full">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative flex items-center w-full group">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50 group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-md pl-12 pr-md focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-on-surface-variant/40 border border-outline-variant/30 focus:border-primary" id="fullName" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Phone Input -->
<div class="space-y-sm flex flex-col w-full">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="phoneNumber">Phone Number</label>
<div class="relative flex items-center w-full group h-12 bg-surface-container-low rounded-lg border border-outline-variant/30 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary focus-within:bg-surface-container-lowest transition-all overflow-hidden">
<!-- Country Code Selector (Simplified) -->
<button class="flex items-center space-x-xs pl-md pr-sm py-sm border-r border-outline-variant/30 h-full hover:bg-surface-container-high transition-colors text-on-surface focus:outline-none" type="button">
<span class="font-body-md text-body-md font-medium">US</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">expand_more</span>
</button>
<!-- Phone Number Input -->
<span class="font-body-md text-body-md text-on-surface-variant pl-sm">+1</span>
<input class="w-full bg-transparent text-on-surface font-body-md text-body-md py-md px-sm focus:outline-none placeholder:text-on-surface-variant/40" id="phoneNumber" pattern="[0-9\-\(\)\s]+" placeholder="(555) 123-4567" required="" type="tel">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md uppercase tracking-wider py-md rounded-lg shadow-md hover:shadow-lg hover:bg-primary/90 transition-all active:scale-[0.98] flex items-center justify-center space-x-sm mt-md" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        New here? No problem — we'll create your account automatically.
      </p>
</div>
</div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    
    // Simple loading state simulation
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Connecting...</span>`;
    btn.classList.add('opacity-80', 'pointer-events-none');
    
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.classList.remove('opacity-80', 'pointer-events-none');
      // In a real app, this would handle the auth flow and redirect
      alert('Authentication simulation complete.');
    }, 1500);
  });

  // Basic phone number formatting
  const phoneInput = document.getElementById('phoneNumber');
  phoneInput.addEventListener('input', function(e) {
    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
    e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
  });
</script></main></body></html>
